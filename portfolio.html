<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dorine Becker – Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
	
<body class="portfolio">

<div id="menu-container"></div>

<main>
  <h1 id="page-title"></h1>
  <div class="projets-grid" id="projets-container"></div>
</main>

<!-- ✅ LIGHTBOX UNIQUE -->
<div id="lightbox">
  <button id="close-lightbox" aria-label="Fermer">&times;</button>
<button id="prev-lightbox" aria-label="Précédent">‹</button>
<button id="next-lightbox" aria-label="Suivant">›</button>

  <img src="" alt="" id="lightbox-image" />
  <p id="lightbox-text"></p>
</div>

<script src="categories.js"></script>

<script>
const titleEl = document.getElementById('page-title');
const container = document.getElementById('projets-container');

const categories = allCategories["portfolio"];

let currentIndex = 0;
let currentFiles = [];
let currentDesc = [];
let currentDir = "";

// --- INDEX ---
function loadPortfolioIndex() {
  titleEl.textContent = "Portfolio";
  container.innerHTML = "";

  Object.entries(categories).forEach(([key, cat]) => {
    if (!cat.vignette) return;

    const wrapper = document.createElement("div");
    wrapper.className = "vignette-wrapper";

    const a = document.createElement("a");
    a.className = "vignette";
    a.href = `portfolio.html?cat=${key}`;
    a.innerHTML = `<img src="${cat.vignette}" alt="${cat.title}">`;

    const title = document.createElement("div");
    title.className = "vignette-title";
    title.textContent = cat.title;

    wrapper.appendChild(a);
    wrapper.appendChild(title);
    container.appendChild(wrapper);
  });
}

// --- CATÉGORIE ---
function loadCategory(catKey) {
  const cat = categories[catKey];
  if (!cat) return;

  titleEl.textContent = cat.title;
  container.innerHTML = "";

  const allFiles = [cat.vignette.split('/').pop(), ...cat.files];
  const allDesc = cat.desc;

  allFiles.forEach((file, i) => {
    const wrapper = document.createElement("div");
    wrapper.className = "vignette-wrapper";

    const a = document.createElement("a");
    a.className = "vignette";
    a.href = "#";
    a.innerHTML = `<img src="${cat.dir}${file}" alt="">`;

    a.addEventListener('click', e => {
      e.preventDefault();

      currentFiles = allFiles;
      currentDesc = allDesc;
      currentIndex = i;
      currentDir = cat.dir;

      updateLightbox();
      document.getElementById('lightbox').style.display = 'flex';
    });

    wrapper.appendChild(a);
    container.appendChild(wrapper);
  });
}

// --- UPDATE IMAGE ---
function updateLightbox() {
  if (!currentFiles.length) return;

  const lightboxImage = document.getElementById('lightbox-image');
  const lightboxText = document.getElementById('lightbox-text');

  // Met à jour l'image
  lightboxImage.src = currentDir + currentFiles[currentIndex];

  // Met à jour la description
  lightboxText.textContent = currentDesc[currentIndex] || "";
}

// --- ROUTAGE ---
const params = new URLSearchParams(window.location.search);
const cat = params.get('cat');

if (cat && categories[cat]) {
  loadCategory(cat);
} else {
  loadPortfolioIndex();
}

// --- LIGHTBOX: croix et clic sur fond ---
const lightbox = document.getElementById('lightbox');
const closeBtn = document.getElementById('close-lightbox');
const nextBtn = document.getElementById('next-lightbox');
const prevBtn = document.getElementById('prev-lightbox'); // bouton précédent

closeBtn.addEventListener('click', () => {
  lightbox.style.display = 'none';
});

lightbox.addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') {
    lightbox.style.display = 'none';
  }
});

// --- BOUTON SUIVANT ---
nextBtn.addEventListener('click', () => {
  if (!currentFiles.length) return;
  currentIndex = (currentIndex + 1) % currentFiles.length;
  updateLightbox();
});

// --- BOUTON PRÉCÉDENT ---
prevBtn.addEventListener('click', () => {
  if (!currentFiles.length) return;
  currentIndex = (currentIndex - 1 + currentFiles.length) % currentFiles.length;
  updateLightbox();
});
</script>
