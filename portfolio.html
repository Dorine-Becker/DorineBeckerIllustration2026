<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dorine Becker – Portfolio</title>
  <meta name="description" content="Portfolio de Dorine Becker, illustratrice freelance spécialisée en charadesign, illustration, jeux de société et livres jeunesse." />
  <meta name="author" content="Dorine Becker" />
  <meta property="og:title" content="Dorine Becker – Portfolio" />
  <meta property="og:description" content="Illustrations originales de Dorine Becker : charadesign, jeux de société, livres jeunesse, illustration." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="portfolio">

<div id="menu-container"></div>

<main>
  <h1 id="page-title"></h1>
  <div class="projets-grid" id="projets-container"></div>
</main>

<div id="lightbox">
  <button id="close-lightbox" aria-label="Fermer">&times;</button>
  <div id="lightbox-inner">
    <button id="prev-lightbox" aria-label="Précédent">‹</button>
    <img src="" alt="" id="lightbox-image" />
    <button id="next-lightbox" aria-label="Suivant">›</button>
  </div>
  <p id="lightbox-text"></p>
</div>

<script src="categories.js"></script>

<script>
let currentCategory = null;
let isLightboxOpen = false;
const titleEl = document.getElementById('page-title');
const container = document.getElementById('projets-container');

const categories = allCategories["portfolio"];

let currentIndex = 0;
let currentFiles = [];
let currentDir = "";

// --- INDEX ---
function loadPortfolioIndex() {
  document.title = "Dorine Becker – Portfolio";
  titleEl.textContent = "Portfolio";
  container.innerHTML = "";

  Object.entries(categories).forEach(([key, cat]) => {
    if (!cat.vignette) return;

    const wrapper = document.createElement("div");
    wrapper.className = "vignette-wrapper";

    const a = document.createElement("a");
    a.className = "vignette";
    a.href = `portfolio.html?cat=${key}`;
    a.setAttribute("aria-label", `Voir la catégorie ${cat.title}`);

    const firstText = cat.content && cat.content[0] ? cat.content[0].text : "";
    const alt = firstText
      ? `${firstText} / illustration originale Dorine Becker`
      : `illustration originale Dorine Becker`;

    a.innerHTML = `<img src="${cat.dir}${cat.vignette}" alt="${alt}" loading="lazy">`;

    const titleDiv = document.createElement("div");
    titleDiv.className = "vignette-title";
    titleDiv.textContent = cat.title;

    wrapper.appendChild(a);
    wrapper.appendChild(titleDiv);
    container.appendChild(wrapper);
  });
}

// --- CATÉGORIE ---
function loadCategory(catKey) {
  const cat = categories[catKey];
  if (!cat) return;

  currentCategory = cat;

  document.title = `${cat.title} – Dorine Becker`;
  document.querySelector('meta[name="description"]').setAttribute(
    "content",
    `Illustrations originales de Dorine Becker – ${cat.title} : découvrez les œuvres de cette illustratrice freelance.`
  );

  titleEl.textContent = cat.title;
  container.innerHTML = "";

  const content = cat.content;

  content.forEach((item, i) => {
    const wrapper = document.createElement("div");
    wrapper.className = "vignette-wrapper";

    const a = document.createElement("a");
    a.className = "vignette";
    a.href = "#";

    const alt = item.text
      ? `${item.text} / illustration originale Dorine Becker`
      : `illustration originale Dorine Becker`;

    a.setAttribute("aria-label", item.text || `Illustration ${cat.title} de Dorine Becker`);
    a.innerHTML = `<img src="${cat.dir}${item.file}" alt="${alt}" loading="lazy">`;

    a.addEventListener('click', e => {
      e.preventDefault();
      currentFiles = content;
      currentIndex = i;
      currentDir = cat.dir;
      updateLightbox();
      openLightbox();
    });

    wrapper.appendChild(a);
    container.appendChild(wrapper);
  });
}

// --- UPDATE LIGHTBOX ---
function updateLightbox() {
  if (!currentFiles.length) return;

  const item = currentFiles[currentIndex];
  const lightboxImage = document.getElementById('lightbox-image');
  const lightboxText = document.getElementById('lightbox-text');

  lightboxImage.src = currentDir + item.file;
  lightboxImage.loading = "eager";
  lightboxImage.decoding = "async";
  lightboxImage.alt = item.text
    ? `${item.text} / illustration originale Dorine Becker`
    : `illustration originale Dorine Becker`;

  lightboxText.textContent = item.text || "";
}

// --- ROUTAGE ---
const params = new URLSearchParams(window.location.search);
const cat = params.get('cat');

if (cat && categories[cat]) {
  loadCategory(cat);
} else {
  loadPortfolioIndex();
}

// --- LIGHTBOX ---
const lightbox = document.getElementById('lightbox');
const closeBtn = document.getElementById('close-lightbox');
const nextBtn = document.getElementById('next-lightbox');
const prevBtn = document.getElementById('prev-lightbox');

function openLightbox() {
  lightbox.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  prevBtn.removeAttribute('style');
  nextBtn.removeAttribute('style');
  requestAnimationFrame(() => {
    lightbox.classList.add('active');
  });
  isLightboxOpen = true;
}

function closeLightbox() {
  lightbox.classList.remove('active');
  setTimeout(() => {
    lightbox.style.display = 'none';
    document.body.style.overflow = '';
  }, 250);
  isLightboxOpen = false;
}

nextBtn.addEventListener('click', () => {
  if (!currentFiles.length) return;
  currentIndex = (currentIndex + 1) % currentFiles.length;
  updateLightbox();
});

prevBtn.addEventListener('click', () => {
  if (!currentFiles.length) return;
  currentIndex = (currentIndex - 1 + currentFiles.length) % currentFiles.length;
  updateLightbox();
});

closeBtn.addEventListener('click', closeLightbox);

lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});

document.addEventListener('keydown', (e) => {
  if (!isLightboxOpen) return;
  switch (e.key) {
    case 'Escape':     closeLightbox(); break;
    case 'ArrowRight': nextBtn.click(); break;
    case 'ArrowLeft':  prevBtn.click(); break;
  }
});

document.getElementById('lightbox-image').addEventListener('click', () => {
  nextBtn.click();
});

// Swipe mobile
let touchStartX = 0;
let touchEndX = 0;

lightbox.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
});

lightbox.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  const diff = touchEndX - touchStartX;
  if (Math.abs(diff) < 50) return;
  if (diff < 0) nextBtn.click();
  else prevBtn.click();
});
</script>

</body>
</html>
