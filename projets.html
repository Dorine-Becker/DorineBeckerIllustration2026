<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dorine Becker – Projets</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="portfolio">

<div id="menu-container"></div>

<main>
  <h1 id="page-title"></h1>
  <h2 id="resumeProjet"></h2>
  <div class="projets-grid" id="projets-container"></div>
</main>

<div id="lightbox">
  <button id="close-lightbox" aria-label="Fermer">&times;</button>

  <div id="lightbox-inner">
    <button id="prev-lightbox" aria-label="Précédent">‹</button>
    <img src="" alt="" id="lightbox-image" />
    <button id="next-lightbox" aria-label="Suivant">›</button>
  </div>

  <p id="lightbox-text"></p>
</div>

<script src="categories.js"></script>

<script>
let isLightboxOpen = false;
const titleEl = document.getElementById('page-title');

const container = document.getElementById('projets-container');

// Utilise les projets au lieu du portfolio
const categories = allCategories["projets"];

let currentIndex = 0;
let currentFiles = [];
let currentDesc = [];
let currentDir = "";

// --- INDEX ---
function loadProjetsIndex() {
  titleEl.textContent = "Projets";
  
  container.innerHTML = "";

  Object.entries(categories).forEach(([key, cat]) => {
    if (!cat.vignette) return;

    const wrapper = document.createElement("div");
    wrapper.className = "vignette-wrapper";

    const a = document.createElement("a");
    a.className = "vignette";
    a.href = `projets.html?cat=${key}`;
    a.innerHTML = `<img src="${cat.vignette}" alt="${cat.title}">`;

    const title = document.createElement("div");
    title.className = "vignette-title";
    title.textContent = cat.title;

    wrapper.appendChild(a);
    wrapper.appendChild(title);
    container.appendChild(wrapper);
  });
}


// --- CATÉGORIE ---


function loadCategory(catKey) {
  const cat = categories[catKey];
  if (!cat) return;
  
  titleEl.textContent = cat.title;

  const subtitleEl = document.getElementById('resumeProjet');
  subtitleEl.textContent = cat.resumeProjet || "";
  

  container.innerHTML = "";

  const allFiles = [cat.vignette.split('/').pop(), ...cat.files];
  const allDesc = cat.desc;

  allFiles.forEach((file, i) => {
    const wrapper = document.createElement("div");
    wrapper.className = "vignette-wrapper";

    const a = document.createElement("a");
    a.className = "vignette";
    a.href = "#";
    a.innerHTML = `<img src="${cat.dir}${file}" alt="">`;

    a.addEventListener('click', e => {
      e.preventDefault();

      currentFiles = allFiles;
      currentDesc = allDesc;
      currentIndex = i;
      currentDir = cat.dir;

      updateLightbox();
      openLightbox();
    });

    wrapper.appendChild(a);
    container.appendChild(wrapper);
  });
}

// --- UPDATE IMAGE ---
function updateLightbox() {
  if (!currentFiles.length) return;

  const lightboxImage = document.getElementById('lightbox-image');
  const lightboxText = document.getElementById('lightbox-text');

  lightboxImage.src = currentDir + currentFiles[currentIndex];
  lightboxText.textContent = currentDesc[currentIndex] || "";
}

// --- ROUTAGE ---
const params = new URLSearchParams(window.location.search);
const cat = params.get('cat');

if (cat && categories[cat]) {
  loadCategory(cat);
} else {
  loadProjetsIndex();
}

// --- LIGHTBOX: croix et clic sur fond ---
const lightbox = document.getElementById('console.log(categories.corback);lightbox');
const closeBtn = document.getElementById('close-lightbox');
const nextBtn = document.getElementById('next-lightbox');
const prevBtn = document.getElementById('prev-lightbox');

closeBtn.addEventListener('click', () => {
  lightbox.style.display = 'none';
});

lightbox.addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') {
    lightbox.style.display = 'none';
  }
});

// --- BOUTON SUIVANT ---
nextBtn.addEventListener('click', () => {
  if (!currentFiles.length) return;
  currentIndex = (currentIndex + 1) % currentFiles.length;
  updateLightbox();
});

// --- BOUTON PRÉCÉDENT ---
prevBtn.addEventListener('click', () => {
  if (!currentFiles.length) return;
  currentIndex = (currentIndex - 1 + currentFiles.length) % currentFiles.length;
  updateLightbox();
});

// =============================
// LIGHTBOX PREMIUM
// =============================
function openLightbox() {
  lightbox.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  prevBtn.removeAttribute('style');
  nextBtn.removeAttribute('style');

  requestAnimationFrame(() => {
    lightbox.classList.add('active');
  });

  isLightboxOpen = true;
}

function closeLightbox() {
  lightbox.classList.remove('active');

  setTimeout(() => {
    lightbox.style.display = 'none';
    document.body.style.overflow = '';
  }, 250);

  isLightboxOpen = false;
}

closeBtn.addEventListener('click', closeLightbox);

lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});

// Navigation clavier
document.addEventListener('keydown', (e) => {
  if (!isLightboxOpen) return;

  switch (e.key) {
    case 'Escape':
      closeLightbox();
      break;
    case 'ArrowRight':
      nextBtn.click();
      break;
    case 'ArrowLeft':
      prevBtn.click();
      break;
  }
});

// Clic sur image = suivant
document.getElementById('lightbox-image').addEventListener('click', () => {
  nextBtn.click();
});

// Swipe mobile
let touchStartX = 0;
let touchEndX = 0;

lightbox.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
});

lightbox.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
});

function handleSwipe() {
  const diff = touchEndX - touchStartX;

  if (Math.abs(diff) < 50) return;

  if (diff < 0) {
    nextBtn.click();
  } else {
    prevBtn.click();
  }
}
</script>
